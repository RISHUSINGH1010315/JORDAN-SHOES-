<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login | JORDAN</title>
  <meta name="description" content="Access your Jordan Brand account to view your collection, check order history, and edit your profile settings.">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      :root {
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      }
    }
    .ease-out-expo { transition-timing-function: var(--ease-out-expo); }
    
    .glass-panel {
      background: rgba(18, 18, 18, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    /* Radial Vignette */
    .bg-vignette {
      background: radial-gradient(circle at center, rgba(178, 34, 36, 0.15) 0%, rgba(10, 10, 10, 1) 75%);
    }
    
    /* Input border effect */
    .input-border-bottom {
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      transition: all 0.4s;
    }
    .input-border-bottom:focus {
      border-bottom-color: #ff1a25;
      outline: none;
      box-shadow: 0 1px 0 0 #ff1a25;
    }
    
    /* Shake animation on invalid credentials */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-animate {
      animation: shake 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Premium Solid Black Footer */
    .site-footer {
      position: relative;
      z-index: 3;
      background-color: #050505 !important;
      padding: 3.5rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
    }
    .footer-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    @media (max-width: 768px) {
      .footer-container {
        flex-direction: column;
        gap: 1.5rem;
        text-align: center;
        padding: 0 24px;
      }
    }
    .site-footer p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.8) !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      font-family: 'Inter', sans-serif;
    }
    .footer-links {
      display: flex;
      gap: 2rem;
    }
    .footer-links a {
      color: rgba(255, 255, 255, 0.6) !important;
      font-size: 0.85rem;
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: 'Inter', sans-serif;
    }
    .footer-links a:hover {
      color: #fff !important;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
  </style>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "error-container": "#93000a",
            "on-primary-container": "#ffc8c2",
            "surface-container-highest": "#353534",
            "tertiary-fixed": "#cbe6ff",
            "error": "#ff1a25",
            "background": "#0a0a0a",
            "secondary-container": "#920703",
            "primary-fixed": "#ffdad6",
            "primary-fixed-dim": "#ffb4ac",
            "on-primary-fixed": "#410003",
            "on-secondary-container": "#ff9a8a",
            "on-primary": "#ffffff",
            "on-primary-fixed-variant": "#92030f",
            "tertiary": "#8fcdff",
            "surface-container-lowest": "#050505",
            "outline": "#aa8986",
            "surface-container": "#121212",
            "primary-container": "#ff1a25",
            "on-error-container": "#ffdad6",
            "on-tertiary-fixed": "#001e30",
            "inverse-primary": "#ff1a25",
            "surface": "#121212",
            "inverse-surface": "#e5e2e1",
            "on-secondary-fixed-variant": "#920703",
            "on-secondary-fixed": "#410000",
            "secondary-fixed-dim": "#ffb4a8",
            "on-tertiary-container": "#b1daff",
            "on-tertiary-fixed-variant": "#004b71",
            "outline-variant": "#5a403e",
            "primary": "#ff1a25",
            "inverse-on-surface": "#313030",
            "tertiary-container": "#006292",
            "secondary": "#ffb4a8",
            "surface-container-low": "#0d0d0d",
            "surface-bright": "#393939",
            "secondary-fixed": "#ffdad4",
            "on-secondary": "#690000",
            "on-background": "#ffffff",
            "surface-dim": "#121212",
            "on-tertiary": "#003450",
            "tertiary-fixed-dim": "#8fcdff",
            "surface-variant": "#353534",
            "on-surface": "#e5e2e1",
            "on-error": "#690005",
            "surface-tint": "#ff1a25",
            "surface-container-high": "#1e1e1e",
            "on-surface-variant": "#a0a0a0"
          },
          "borderRadius": {
            "DEFAULT": "4px",
            "lg": "8px",
            "xl": "12px",
            "full": "9999px"
          },
          "spacing": {
            "base": "8px",
            "section-gap-desktop": "120px",
            "section-gap-mobile": "60px",
            "margin-mobile": "24px",
            "gutter": "24px",
            "margin-desktop": "64px",
            "container-max-width": "1440px"
          },
          "fontFamily": {
            "headline-lg-mobile": ["Montserrat"],
            "subheading-spaced": ["Inter"],
            "body-lg": ["Inter"],
            "label-sm": ["Inter"],

          },
          "fontSize": {
            "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],

            "headline-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "display-xl": ["80px", {"lineHeight": "1.0", "letterSpacing": "-0.04em", "fontWeight": "900"}],
            "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}]
          }
        },
      },
    }

<body class="bg-background text-on-background selection:bg-primary selection:text-on-primary min-h-screen flex flex-col bg-vignette">

  <!-- Top Navigation Bar -->
  <header class="fixed top-0 w-full z-50 bg-background/40 backdrop-blur-xl border-b border-white/10">
    <div class="flex justify-between items-center px-margin-desktop py-8 w-full max-w-container-max-width mx-auto">
      <a href="index.html" class="font-display-xl text-headline-lg font-black tracking-tighter text-on-background cursor-pointer hover:text-primary transition-colors">JORDAN</a>
      <nav class="hidden md:flex items-center gap-10">
        <a class="font-subheading-spaced text-subheading-spaced uppercase tracking-widest text-on-background/70 hover:text-on-background transition-colors duration-400" href="index.html">SHOP</a>
        <a class="font-subheading-spaced text-subheading-spaced uppercase tracking-widest text-on-background/70 hover:text-on-background transition-colors duration-400" href="Collection.html">COLLECTIONS</a>
        <a class="font-subheading-spaced text-subheading-spaced uppercase tracking-widest text-on-background/70 hover:text-on-background transition-colors duration-400" href="Comunity.html">COMMUNITY</a>
        <a class="font-subheading-spaced text-subheading-spaced uppercase tracking-widest text-on-background/70 hover:text-on-background transition-colors duration-400" href="Hertiage.html">HERITAGE</a>
        <a class="font-subheading-spaced text-subheading-spaced uppercase tracking-widest text-on-background/70 hover:text-on-background transition-colors duration-400" href="threed.html">STUDIO</a>
      </nav>
      <div class="flex items-center gap-6">
        <a href="bag.html" class="scale-95 active:scale-90 transition-transform duration-400 hover:text-primary flex items-center justify-center relative" aria-label="Shopping Bag">
          <span class="material-symbols-outlined text-[24px]">shopping_bag</span>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-primary text-white font-bold text-[9px] w-4 h-4 rounded-full flex items-center justify-center scale-0 transition-transform duration-300">0</span>
        </a>
        <a href="Profile.html" class="scale-95 active:scale-90 transition-transform duration-400 hover:text-primary flex items-center justify-center" aria-label="User Profile">
          <span class="material-symbols-outlined text-[24px]">person</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Login Container -->
  <main class="flex-1 flex items-center justify-center px-6 py-32">
    <div id="login-card" class="glass-panel max-w-md w-full p-10 rounded-sm relative overflow-hidden transition-all duration-500">
      
      <!-- Top aesthetic light -->
      <div class="absolute top-0 inset-x-0 h-[2px] bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
      
      <div class="mb-10 text-center">
        <span class="font-subheading-spaced text-[10px] uppercase tracking-[0.25em] text-primary">ACCESS GRANTED</span>
        <h1 class="font-display-xl text-3xl uppercase mt-2 tracking-tight">LOG IN</h1>
      </div>

      <!-- General Error Alert -->
      <div id="error-alert" class="hidden mb-6 p-4 border border-primary/20 bg-primary/5 text-primary text-xs font-label-sm uppercase tracking-wide rounded-sm flex items-center gap-3">
        <span class="material-symbols-outlined text-sm">warning</span>
        <span id="error-message">Invalid email or password.</span>
      </div>

      <form id="login-form" class="space-y-8">
        <div class="flex flex-col gap-2">
          <label class="font-label-sm text-[10px] uppercase text-on-surface-variant tracking-widest">EMAIL ADDRESS</label>
          <input id="login-email" class="input-border-bottom py-3 text-white focus:outline-none" type="email" placeholder="example@flightclub.com" required autocomplete="email" />
        </div>
        
        <div class="flex flex-col gap-2">
          <label class="font-label-sm text-[10px] uppercase text-on-surface-variant tracking-widest">PASSWORD</label>
          <input id="login-password" class="input-border-bottom py-3 text-white focus:outline-none" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <div class="flex items-center justify-between text-xs font-label-sm">
          <label class="flex items-center gap-2 cursor-pointer text-on-surface-variant hover:text-white transition-colors">
            <input class="w-4 h-4 bg-surface-container border-white/10 rounded-none checked:bg-primary focus:ring-0 focus:ring-offset-0" type="checkbox" />
            <span class="uppercase tracking-wider">REMEMBER ME</span>
          </label>
          <a href="#" class="text-primary hover:underline uppercase tracking-wider">Forgot?</a>
        </div>

        <button type="submit" class="w-full bg-primary text-white py-4 font-subheading-spaced text-xs uppercase tracking-widest hover:bg-white hover:text-black transition-all ease-out-expo duration-400 active:scale-95">
          ENTER FLIGHT CLUB
        </button>
      </form>

      <div class="mt-8 pt-8 border-t border-white/5 text-center text-xs font-label-sm uppercase tracking-wider text-on-surface-variant">
        <span>DON'T HAVE AN ACCOUNT?</span>
        <a href="Registration.html" class="text-white hover:text-primary transition-colors font-bold ml-1">REGISTER</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 JORDAN BRAND. All Rights Reserved. Created by RISHU.</p>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Use</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import JordanAuth from './auth.js';
    import './cart.js';

    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const loginEmail = document.getElementById('login-email');
      const loginPassword = document.getElementById('login-password');
      const loginCard = document.getElementById('login-card');
      const errorAlert = document.getElementById('error-alert');
      const errorMessage = document.getElementById('error-message');

      // Redirect if already logged in
      if (JordanAuth.getCurrentUser()) {
        window.location.href = 'Profile.html';
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Hide error alert initially
        errorAlert.classList.add('hidden');
        loginCard.classList.remove('shake-animate');

        const email = loginEmail.value.trim();
        const password = loginPassword.value;

        try {
          // Verify login credentials using database engine
          await JordanAuth.login(email, password);
          
          // Redirect to Profile page on success
          window.location.href = 'Profile.html';
        } catch (error) {
          // Display error details
          errorMessage.textContent = error.message.toUpperCase();
          errorAlert.classList.remove('hidden');
          
          // Trigger card shake animation
          setTimeout(() => {
            loginCard.classList.add('shake-animate');
          }, 10);
        }
      });
    });
  </script>
</body>
</html>
